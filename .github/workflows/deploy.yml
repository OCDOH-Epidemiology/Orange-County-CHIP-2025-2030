# Builds the site and publishes it to GitHub Pages on every push to `main`.
#
# For this workflow to work you must:
#   1. In your GitHub repository, go to Settings → Pages
#   2. Under "Build and deployment", set Source to "GitHub Actions"
#   3. Make sure `base` in vite.config.js is set to `/YOUR_REPO_NAME/`
#      (see the comment in vite.config.js)
#
# The workflow uses the official actions from GitHub — no third-party actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one deployment at a time; if a new push comes in mid-run, cancel the old.
concurrency:
  group: pages
  cancel-in-progress: true

# The Pages deployment needs these permissions.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate chip-data.json from the sample workbook
        # Ensures the deployed site always uses the JSON that matches the
        # committed Excel workbook. Comment this out if you prefer to commit
        # chip-data.json by hand instead.
        run: npm run data:build:sample

      - name: Build the site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
